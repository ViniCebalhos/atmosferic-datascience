# CI: lint, type check, docs, tests
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps (for cartopy)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev libproj-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements/dev.txt

      - name: isort
        run: isort --check-only .

      - name: flake8
        run: flake8 . --extend-exclude=dist,build --show-source --statistics

      - name: pyright
        run: pyright .

      - name: interrogate (docstrings)
        run: interrogate --fail-under 90 --verbose .

      - name: pydocstyle
        run: pydocstyle --convention numpy --explain --verbose .

      - name: pytest
        run: pytest -v
